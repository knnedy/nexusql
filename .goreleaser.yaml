version: 2
project_name: nexusql
before:
  hooks:
    - sh -c "cd web && pnpm install && pnpm run build"
    - rm -rf cmd/nexusql/out
    - cp -r web/out cmd/nexusql/out
builds:
  - id: nexusql
    main: ./cmd/nexusql
    binary: nexusql
    ldflags:
      - -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - id: nexusql
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md
      - preview-canvas.png
      - preview-explorer.png
checksum:
  name_template: "checksums.txt"
changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug Fixes
      regexp: "^fix"
release:
  github:
    owner: knnedy
    name: nexusql
  draft: false
  prerelease: auto
  name_template: "NexusQL {{.Version}}"
